<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kacky Live overlay mockup</title>
<!--
  Static mockup for the overlay spec (docs/specs/overlay-mvp.md). Not app code.

  Query params:
    widget = schedule | progress; unset shows both on the full 1920x1080 layer
    stats  = comma list from progress, milestone, rank, avg, wr (default progress,milestone,rank)
    state  = live (default) | hunting | alert | overlap
    bg    = optional image URL shown behind the overlay, for local previews only
    plain = 1 shows a neutral backdrop instead of transparency
-->
<style>
  :root {
    --panel: rgba(10, 10, 14, 0.74);
    --panel-edge: rgba(255, 255, 255, 0.08);
    --text: #f4f4f6;
    --muted: #a3a3ad;
    --accent: #ff7800;
    --live: #3ddc84;
    --next: #ffc83d;
    --later: #ff5a5a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body {
    position: relative;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    background-size: cover;
  }
  body.plain {
    background:
      linear-gradient(135deg, #5d6470 0%, #8b919b 45%, #b9a27c 100%);
  }

  .panel {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }

  /* Stats strip */
  .strip {
    left: 380px; top: 14px;
    height: 52px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 18px 0 8px;
    font-size: 20px;
  }
  .badge {
    background: var(--accent); color: #111;
    font-weight: 700; font-size: 16px; letter-spacing: 0.06em;
    padding: 6px 10px; border-radius: 6px;
    white-space: nowrap;
  }
  .progress { display: flex; align-items: center; gap: 10px; }
  .bar { width: 120px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .sep { width: 1px; height: 22px; background: var(--panel-edge); }
  .strip b { font-weight: 650; }
  .strip .muted { color: var(--muted); }
  .strip > span { white-space: nowrap; }

  /* Up next */
  .next {
    left: 24px; top: 724px;
    width: 400px;
    padding: 14px 16px 10px;
  }
  .next h2 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 15px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted);
    margin-bottom: 8px;
  }
  .next h2 span { font-weight: 500; letter-spacing: 0.04em; font-size: 14px; }
  .row {
    display: grid; grid-template-columns: 14px 74px 44px 1fr;
    align-items: center; gap: 8px;
    height: 44px; padding: 0 10px;
    border-radius: 7px;
    font-size: 21px;
  }
  .row + .row { margin-top: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .live .dot { background: var(--live); }
  .nexts .dot { background: var(--next); }
  .later .dot { background: var(--later); }
  .map { font-weight: 700; }
  .srv { color: var(--muted); font-size: 17px; }
  .when { text-align: right; white-space: nowrap; }
  .when small { color: var(--muted); font-size: 17px; margin-right: 6px; }
  .live { background: rgba(61, 220, 132, 0.10); }
  .alerting { outline: 2px solid var(--accent); background: rgba(255, 120, 0, 0.16); }
  .alerting .when { color: var(--accent); font-weight: 700; }

  /* A favourite the streamer already finished: still listed until they unfav it, but dimmed. */
  .finished { opacity: 0.45; }
  .finished .map::after { content: " ✓"; font-weight: 400; color: var(--live); }

  /* Favourites that start at the same moment (servers in one sync group switch together). */
  .group {
    position: relative;
    margin: 4px 0;
    padding: 22px 0 2px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 8px;
  }
  .group > .cap {
    position: absolute; left: 10px; top: 3px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted);
  }

  .hidden { display: none; }

  /* One widget per browser source: the widget sits in the top-left corner and the source is sized
     to it in OBS, so the streamer places each widget on its own. */
  html.single, html.single body { width: 100vw; height: 100vh; }
  html.single .panel { left: 0; top: 0; box-shadow: none; }
</style>
</head>
<body>

<div class="panel strip" id="strip"></div>

<div class="panel next" id="next">
  <h2>UP NEXT <span>favourites</span></h2>
  <div id="rows"></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const state = params.get('state') || 'live';
  const widget = params.get('widget');
  if (widget) document.documentElement.classList.add('single');
  if (params.get('bg')) document.body.style.backgroundImage = `url("${params.get('bg')}")`;
  else if (params.get('plain') === '1') document.body.classList.add('plain');

  // Illustrative numbers, shaped like the API responses in the spec (SmithyTM, 2026-11-08).
  const kr7 = {
    badge: 'KR7', done: 51, total: 75, rank: 3, avg: 230, wr: 2,
    tier: 'silver',
    thresholds: [['plastic', 10], ['bronze', 25], ['silver', 40], ['gold', 60], ['kacky', 75]],
  };
  const stats = {
    live: kr7, alert: kr7, overlap: kr7,
    hunting: {
      badge: 'HUNTING', done: 193, total: 450, rank: 160, avg: 139, wr: 0,
      tier: 'bronze',
      thresholds: [['plastic', 60], ['bronze', 140], ['silver', 240], ['gold', 360], ['kacky', 450]],
    },
  }[state];
  const picked = (params.get('stats') || 'progress,milestone,rank').split(',').map(s => s.trim());

  const rows = {
    live: [
      { map: 464, srv: 'S8', state: 'live',  secs: 252 },
      { map: 503, srv: 'S7', state: 'next',  secs: 580 },
      { map: 486, srv: 'S1', state: 'later', secs: 1865, finished: true },
      { map: 517, srv: 'S3', state: 'later', secs: 3092 },
    ],
    overlap: [
      { map: 464, srv: 'S8', state: 'live',  secs: 252 },
      { map: 503, srv: 'S7', state: 'next',  secs: 580, group: 'same' },
      { map: 511, srv: 'S9', state: 'next',  secs: 580, group: 'same' },
      { map: 486, srv: 'S1', state: 'later', secs: 1865 },
    ],
    alert: [
      { map: 503, srv: 'S7', state: 'next',  secs: 28, alert: true },
      { map: 486, srv: 'S1', state: 'later', secs: 1313 },
      { map: 517, srv: 'S3', state: 'later', secs: 2540 },
    ],
    hunting: [],
  }[state];

  const clock = s => s >= 3600
    ? `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
    : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

  const cap = s => s[0].toUpperCase() + s.slice(1);
  function milestone() {
    const i = stats.thresholds.findIndex(([tier]) => tier === stats.tier);
    const next = stats.thresholds[i + 1];
    if (!next) return `<b>${cap(stats.tier)}</b>`;
    return `<b>${cap(stats.tier)}</b> <span class="muted">· ${next[1] - stats.done} to ${cap(next[0])}</span>`;
  }
  const pct = Math.round(stats.done / stats.total * 100);
  const parts = {
    progress: () => `<span class="progress"><b>${stats.done}</b><span class="muted">/ ${stats.total}</span>
      <span class="bar"><i style="width:${pct}%"></i></span></span>`,
    milestone: () => `<span>${milestone()}</span>`,
    rank: () => `<span><span class="muted">Rank</span> <b>#${stats.rank}</b></span>`,
    avg: () => `<span><span class="muted">Avg</span> <b>${stats.avg}</b></span>`,
    wr: () => `<span><b>${stats.wr}</b> <span class="muted">WR</span></span>`,
  };
  const strip = document.getElementById('strip');
  strip.innerHTML = `<span class="badge">${stats.badge}</span>` + picked
    .filter(name => parts[name])
    .map(name => parts[name]())
    .join('<span class="sep"></span>');

  const next = document.getElementById('next');
  if (rows.length === 0 || widget === 'progress') next.classList.add('hidden');
  if (widget === 'schedule') strip.classList.add('hidden');

  function rowHtml(r) {
    const cls = r.state === 'live' ? 'live' : r.state === 'next' ? 'nexts' : 'later';
    const when = r.state === 'live'
      ? `<small>live</small>${clock(r.secs)} left`
      : `<small>in</small>${clock(r.secs)}`;
    return `<div class="row ${cls}${r.alert ? ' alerting' : ''}${r.finished ? ' finished' : ''}">
      <span class="dot"></span><span class="map">#${r.map}</span>
      <span class="srv">${r.srv}</span><span class="when">${when}</span></div>`;
  }

  function render() {
    // Rows sharing a group start together and are boxed under one caption.
    let html = '';
    for (let i = 0; i < rows.length; i++) {
      const g = rows[i].group;
      if (!g) { html += rowHtml(rows[i]); continue; }
      let j = i;
      while (j + 1 < rows.length && rows[j + 1].group === g) j++;
      html += `<div class="group"><span class="cap">AT THE SAME TIME</span>${rows.slice(i, j + 1).map(rowHtml).join('')}</div>`;
      i = j;
    }
    document.getElementById('rows').innerHTML = html;
  }
  render();
  // Counts down like the real overlay would between polls.
  setInterval(() => { rows.forEach(r => { if (r.secs > 0) r.secs--; }); render(); }, 1000);
</script>
</body>
</html>
