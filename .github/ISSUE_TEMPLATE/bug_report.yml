name: Bug report
description: Report a problem with the overlay, the docs or the website.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Keep it short and reproducible.

        Do not paste secrets, tokens, cookies or private server data. If the problem is a security issue, use [SECURITY.md](https://github.com/kacky-code/kacky-live/blob/main/SECURITY.md) instead.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Describe the actual result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Describe the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that shows the problem.
      placeholder: |
        1. Open the overlay with ...
        2. Wait for ...
        3. See ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Browser and OBS version
      description: Include the browser and OBS versions you used.
      placeholder: Chrome 130, OBS Studio 31.0
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot at 1920x1080
      description: For visual bugs, add a screenshot at 1920x1080 and mark what is wrong.
      placeholder: Drag the screenshot here or paste a link.
  - type: checkboxes
    id: safety
    attributes:
      label: Before you submit
      options:
        - label: I removed secrets, tokens, cookies and private server data from this report.
          required: true
